<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionari [versione: alpha 0.4]</title>
  <link rel="icon" type="image/jpeg" href="assets/loghino.jpeg">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: clamp(16px, 4svh, 48px) 24px;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Verdana, Geneva, sans-serif;
      font-size: 1.125rem;
      background: #F0F0FF;
      color: #252342;
    }

    main {
      width: 100%;
      max-width: 800px;
    }

    header {
      margin-bottom: clamp(16px, 3.5svh, 36px);
      text-align: center;
    }

    .page-logo {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      margin: 0 auto clamp(10px, 2svh, 20px);
    }

    h1 {
      margin: 0;
      font-size: 1em;
      font-weight: 700;
      line-height: 1.35;
    }

    /* Keep two buttons on each row at every screen size. */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(24px, 4svh, 32px);
    }

    a.btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: clamp(116px, 20svh, 144px);
      padding: clamp(8px, 1.5svh, 16px) 24px;
      border: 1px solid #ffffff30;
      border-radius: 22px;
      background: linear-gradient(135deg, #6a63d7, #514bb5);
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 8px 24px #514bb51a;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    a.btn--dalia {
      background: linear-gradient(135deg, #3f777e, #2e5f68);
      box-shadow: 0 8px 24px #2e5f681a;
    }

    .btn__group {
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .btn__label {
      max-width: 100%;
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .btn__description {
      font-weight: 400;
    }

    .btn__arrow {
      position: absolute;
      right: 22px;
      bottom: 18px;
      font-size: 1em;
    }

    @media (hover: hover) {
      a.btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 28px #25234226;
      }
    }

    a.btn:focus-visible {
      outline: 3px solid #252342;
      outline-offset: 5px;
    }

    a.btn:active {
      transform: translateY(1px);
    }

    @media (max-width: 480px) {
      body {
        padding-inline: 16px;
      }

      .grid {
        gap: 18px;
      }

      a.btn {
        padding-inline: 10px;
        border-radius: 18px;
      }

      .btn__arrow {
        right: 12px;
        bottom: 12px;
      }
    }

    /* Leave room for the full-size logo in a short tablet viewport. */
    @media (max-height: 540px) {
      body {
        padding-block: 8px;
      }

      header,
      .page-logo {
        margin-bottom: 8px;
      }

      h1,
      .btn__label {
        line-height: 1.2;
      }

      .grid {
        row-gap: 18px;
      }

      a.btn {
        min-height: 0;
        padding-block: 5px;
      }

      .btn__arrow {
        bottom: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      a.btn {
        transition: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="page-logo" src="assets/loghino.jpeg" alt="" width="210" height="208">
      <h1>Selezionare i questionari</h1>
    </header>
    <nav class="grid" aria-label="Questionari disponibili">
      <a class="btn" href="https://tripetto.app/run/05EFSK1D6E">
        <span class="btn__label">1-2<br><span class="btn__description">(informazioni)</span><br><br><span class="btn__group">~ TREND ~</span></span>
        <span class="btn__arrow" aria-hidden="true">&#8599;</span>
      </a>
      <a class="btn" href="https://tripetto.app/run/KU0Z4X1OX6">
        <span class="btn__label">2-2<br><span class="btn__description">(test)</span><br><br><span class="btn__group">~ TREND ~</span></span>
        <span class="btn__arrow" aria-hidden="true">&#8599;</span>
      </a>
      <a class="btn btn--dalia" href="https://tripetto.app/run/05EFSK1D6E">
        <span class="btn__label">1-2<br><span class="btn__description">(FED)</span><br><br><span class="btn__group">~ DALIA ~</span></span>
        <span class="btn__arrow" aria-hidden="true">&#8599;</span>
      </a>
      <a class="btn btn--dalia" href="https://tripetto.app/run/KU0Z4X1OX6">
        <span class="btn__label">2-2<br><span class="btn__description">(NDD)</span><br><br><span class="btn__group">~ DALIA ~</span></span>
        <span class="btn__arrow" aria-hidden="true">&#8599;</span>
      </a>
    </nav>
  </main>
</body>
</html>
