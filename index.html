<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionari [versione: alpha 0.4]</title>
  <style>
    /* Page layout: centered content, light background */
    body {
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Verdana, Geneva, "DejaVu Sans", sans-serif;
      background: #ffffff;
      color: #000000;
    }

    h1 {
      margin: 0 0 32px;
      font-size: 1.8rem;
      text-align: center;
    }

    /* Grid of buttons: two columns on a tablet, one column on narrow screens */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 900px;
    }

    /* Large, touch-friendly buttons */
    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      padding: 24px;
      border-radius: 16px;
      background: #6a68da;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    a.btn:active {
      background: #3a38da;
    }
  </style>
</head>
<body>
  <h1>Selezionare i questionari</h1>
  <div class="grid">
    <a class="btn" href="https://tripetto.app/run/05EFSK1D6E">1-2 (informazioni) TREND</a>
    <a class="btn" href="https://tripetto.app/run/KU0Z4X1OX6">2-2 (test) TREND</a>
    <a class="btn" href="https://tripetto.app/run/05EFSK1D6E">1-2 (FED) DALIA</a>
    <a class="btn" href="https://tripetto.app/run/KU0Z4X1OX6">2-2 (NDD) DALIA</a>
  </div>
</body>
</html>
